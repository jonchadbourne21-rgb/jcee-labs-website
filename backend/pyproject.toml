[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-property-claims-api"
version = "0.1.0"
description = "Deterministic FastAPI prototype for autonomous property insurance claims"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=41,<46",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["backend"]
package-dir = {backend = "."}
