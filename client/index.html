<!doctype html>
<html lang="en" class="dark">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Jcee Labs | Innovation & AI Lab</title>
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JCEE Labs — Evidence-Oriented Execution for AI Software" />
    <meta property="og:description" content="An independent software lab building tools for agentic AI and human transformation. Evidence over claims." />
    <meta property="og:image" content="/manus-storage/jcee-labs-og-teal_587de72d.png" />
    <meta property="og:url" content="https://jceelabs.com" />
    <meta property="og:site_name" content="JCEE Labs" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JCEE Labs — Evidence-Oriented Execution for AI Software" />
    <meta name="twitter:description" content="An independent software lab building tools for agentic AI and human transformation. Evidence over claims." />
    <meta name="twitter:image" content="/manus-storage/jcee-labs-og-teal_587de72d.png" />
    <link rel="icon" href="/brand/jcee-labs-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking font load: media=print trick swaps to all after load -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Space+Mono:wght@400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
    </noscript>
    <!-- JCEE Labs master brand accent + alternating editorial chapter system -->
    <style>
      :root {
        --signal: #1a5cff !important;
        --signal-readable: #4d8aff;
        --chapter-dark: #000000;
        --chapter-light: #0a0a14;
        --chapter-white: #ffffff;
        --chapter-line-dark: rgba(26,92,255,.3);
        --chapter-line-light: rgba(26,92,255,.2);
      }

      html { overflow-x: clip; }

      /* ── Legibility floor ── */
      nav a,
      .header-contact { font-size: 12px !important; }

      .eyebrow,
      .primary-link { font-size: 12px !important; }

      .availability,
      .receipt-header,
      .receipt-id,
      .receipt-row,
      .hash-line,
      .receipt-footer { font-size: 11px !important; }

      .section-index span,
      .company-statement > p,
      .qcs-kicker,
      .qcs-status-grid dt,
      .qcs-status-grid dd,
      .mirrored-kicker,
      .mirrored-meta span { font-size: 11px !important; }

      .brand-footer-lockup small,
      .brand-footer-links span { font-size: 10px !important; }

      .brand-footer-links a { font-size: 12px !important; }
      .brand-footer-meta { font-size: 10px !important; }

      .company-bottom p,
      .vow-intro p,
      .charter-intro-copy p,
      .qcs-copy > p,
      .mirrored-copy > p { font-size: clamp(16px, 1.25vw, 20px) !important; }

      /* Cobalt remains the signal, not the page fill. */
      .qcs-kicker,
      .qcs-status-grid dd,
      .qcs-copy > a,
      .mirrored-copy > a,
      .receipt-status,
      .receipt-footer strong,
      .mirrored-kicker,
      .program-statement-dark .charter-section-label {
        color: var(--signal-readable) !important;
      }

      /* ── Numbered homepage chapters: alternating black / white ── */

      /* 01 / JCEE LABS — black */
      .company-section {
        background: var(--chapter-dark) !important;
        color: var(--chapter-white) !important;
      }
      .company-section .section-index,
      .company-section .company-bottom {
        border-color: var(--chapter-line-dark) !important;
      }
      .company-section .section-index,
      .company-section .company-statement > p {
        color: #b9b9b3 !important;
      }
      .company-section .company-bottom p { color: #deddd6 !important; }
      .company-section .company-bottom a { color: var(--signal-readable) !important; }

      /* 02 / VOW — white */
      .vow-section {
        background: var(--chapter-light) !important;
        color: #ffffff !important;
      }
      .vow-section .section-index,
      .vow-section .guarantee-grid,
      .vow-section .guarantee-grid article,
      .vow-section .vow-close {
        border-color: var(--chapter-line-light) !important;
      }
      .vow-section .section-index,
      .vow-section .quiet,
      .vow-section .guarantee-grid article > span {
        color: #8888aa !important;
      }
      .vow-section .guarantee-grid p { color: #4f4f4a !important; }
      .vow-section .terminal-line {
        background: transparent !important;
        color: #ffffff !important;
        border-bottom: 1px solid var(--chapter-dark) !important;
        padding: 18px 0 !important;
      }
      .vow-section .terminal-line > span:first-child {
        color: var(--signal-readable) !important;
        font-weight: 700;
      }
      .vow-section .terminal-line code { color: #ffffff !important; }
      .vow-section .terminal-line .cursor { background: #0a0a14 !important; border-top: 1px solid rgba(26,92,255,.3) !important; }
      .vow-section .section-detail-link { color: var(--signal-readable) !important; }

      /* 03 / RESEARCH & EVIDENCE — black */
      .evidence-intro {
        background: var(--chapter-dark) !important;
        color: var(--chapter-white) !important;
      }
      .evidence-intro .section-index { border-color: var(--chapter-line-dark) !important; color: #b9b9b3 !important; }
      .evidence-intro .charter-intro-copy p { color: #deddd6 !important; }
      .evidence-intro .charter-intro-copy a { color: var(--signal-readable) !important; }

      /* 04 / QCS — white */
      .qcs-section {
        background: var(--chapter-light) !important;
        color: #ffffff !important;
      }
      .qcs-section .section-index.light {
        border-color: var(--chapter-line-light) !important;
        color: #8888aa !important;
      }
      .qcs-section .qcs-copy > p { color: #c8c8d0 !important; }
      .qcs-section .qcs-copy > p.quiet { color: #8888aa !important; }
      .qcs-section .qcs-status-grid,
      .qcs-section .qcs-status-grid > div { border-color: var(--chapter-line-light) !important; }
      .qcs-section .qcs-status-grid dt { color: #8888aa !important; }
      .qcs-section .qcs-status-grid dd,
      .qcs-section .qcs-kicker,
      .qcs-section .qcs-copy > a { color: var(--signal-readable) !important; }

      /* 05 / CHARTER — black */
      .charter-intro:not(.evidence-intro) {
        background: var(--chapter-dark) !important;
        color: var(--chapter-white) !important;
      }
      .charter-intro:not(.evidence-intro) .section-index {
        border-color: var(--chapter-line-dark) !important;
        color: #b9b9b3 !important;
      }
      .charter-intro:not(.evidence-intro) .charter-intro-copy p { color: #deddd6 !important; }
      .charter-intro:not(.evidence-intro) .charter-intro-copy a { color: var(--signal-readable) !important; }

      /* 06 / MIRRORED — white */
      .mirrored-section {
        background: var(--chapter-light) !important;
        color: #ffffff !important;
      }
      .mirrored-section .section-index.light { border-color: var(--chapter-line-light) !important; color: #8888aa !important; }
      .mirrored-section .mirrored-copy > p { color: #c8c8d0 !important; }
      .mirrored-section .mirrored-kicker,
      .mirrored-section .mirrored-copy > a { color: var(--signal-readable) !important; }
      .mirrored-section .mirrored-meta { border-color: var(--chapter-line-light) !important; }
      .mirrored-section .orbit { border-color: rgba(26,92,255,.3) !important; }
      .mirrored-section .mirror-core { border-color: #ffffff !important; color: #ffffff !important; }

      /* Footer remains the single full electric-teal institutional lockup — darker shade for weight. */
      .brand-footer {
        background: #0a0a14 !important; border-top: 1px solid rgba(26,92,255,.3) !important;
        color: #ffffff !important;
        border-top: 3px solid var(--ink) !important;
      }
      .brand-footer-top > p,
      .brand-footer-lockup small,
      .brand-footer-links span,
      .brand-footer-links a,
      .brand-footer-meta,
      .brand-footer-meta a {
        color: #ffffff !important;
      }

      /* Keep the footer statement fully inside the viewport on laptop/desktop widths. */
      @media (min-width: 561px) {
        .brand-footer-wordmark {
          font-size: clamp(52px, 8.8vw, 160px) !important;
          gap: 1vw !important;
          justify-content: space-between;
          width: 100%;
        }
      }

      @media (max-width: 560px) {
        nav a,
        .header-contact,
        .eyebrow,
        .primary-link { font-size: 11px !important; }

        .section-index span,
        .company-statement > p,
        .qcs-kicker,
        .qcs-status-grid dt,
        .qcs-status-grid dd,
        .mirrored-kicker,
        .mirrored-meta span { font-size: 10.5px !important; }

        .brand-footer-links a { font-size: 11px !important; }
        .brand-footer-meta { font-size: 9.5px !important; }
      }
    </style>
  </head>

  <body class="bg-[#090514] text-[#E2E8F0] antialiased overflow-x-hidden selection:bg-purple-500/30 selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
