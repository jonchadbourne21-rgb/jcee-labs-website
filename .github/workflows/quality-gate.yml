name: Quality Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare source
        run: git clone --depth 1 --branch feature/hex-wave-homepage https://github.com/jonchadbourne21-rgb/jcee-labs-website.git source

      - name: Verify
        working-directory: source
        run: |
          npm install --global pnpm@10.4.1
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
