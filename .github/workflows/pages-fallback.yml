# Primary GitHub Pages deployment for jceelabs.com
name: JCEE Labs GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build production site for custom domain
        run: pnpm exec vite build --base=/

      - name: Harden production artifact
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const indexPath = path.join("dist/public", "index.html");
          let html = fs.readFileSync(indexPath, "utf8");

          html = html
            .replace(/\s*<script id="manus-runtime">[\s\S]*?<\/script>/, "")
            .replace(/\s*<script\s+defer\s+src="%VITE_ANALYTICS_ENDPOINT%\/umami"[\s\S]*?<\/script>/, "")
            .replaceAll(
              'content="/manus-storage/jcee-labs-og-teal_587de72d.png"',
              'content="https://jceelabs.com/brand/jcee-labs-mark.png"'
            );

          fs.writeFileSync(indexPath, html);
          NODE

      - name: Verify production artifact boundary
        shell: bash
        run: |
          test -f dist/public/CNAME
          grep -qx 'jceelabs.com' dist/public/CNAME
          ! grep -q 'id="manus-runtime"' dist/public/index.html
          ! grep -q 'VITE_ANALYTICS_ENDPOINT' dist/public/index.html
          grep -q '/assets/' dist/public/index.html
          ! grep -q '/jcee-labs-website/assets/' dist/public/index.html
          grep -q 'content="https://jceelabs.com"' dist/public/index.html

      - name: Prepare SPA fallback
        run: |
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
