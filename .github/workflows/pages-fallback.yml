# Uses the URL already configured in Settings > Pages. DNS is never changed here.
name: JCEE Labs GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static site (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: project
            url: https://jonchadbourne21-rgb.github.io/jcee-labs-website/
            base: /jcee-labs-website
          - mode: root
            url: https://jceelabs.com/
            base: ""
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check and unit tests
        run: |
          pnpm check
          pnpm test
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: Build static artifact
        env:
          PAGES_BASE_URL: ${{ matrix.url }}
        run: node scripts/build-pages.mjs
      - name: Verify public pages on a static server
        env:
          PAGES_BASE_PATH: ${{ matrix.base }}
        run: node scripts/public-surface-check.mjs
      - name: Preserve validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcee-pages-${{ matrix.mode }}
          path: dist/public
          include-hidden-files: true
          retention-days: 14

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6
      - name: Bind direct-human deployment authority
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              raise SystemExit("AUTHORITY_IDENTITY_UNAVAILABLE")
          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          actor=os.environ["GITHUB_ACTOR"]
          run_id=os.environ["GITHUB_RUN_ID"]
          namespace="github-actions.direct-human.v1"
          key=f"pages-deploy:{repo}:{sha}"
          mechanism="DIRECT_HUMAN_WORKFLOW_DISPATCH"
          payload="|".join([namespace,key,run_id,actor,mechanism])
          receipt={
              "namespace":namespace,
              "authority_key":key,
              "generation":int(run_id),
              "sigma":hashlib.sha256(payload.encode()).hexdigest(),
              "mechanism":mechanism,
              "actor":actor,
              "source_sha":sha,
              "run_id":int(run_id),
          }
          os.makedirs("artifacts/authority",exist_ok=True)
          open("artifacts/authority/pages-deploy.json","w").write(
              json.dumps(receipt,indent=2)+"\n"
          )
          print(json.dumps(receipt))
          PY
      - name: Preserve deployment authority receipt
        uses: actions/upload-artifact@v4
        with:
          name: jcee-pages-deploy-authority
          path: artifacts/authority/pages-deploy.json
          retention-days: 30
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read configured GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for configured URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
