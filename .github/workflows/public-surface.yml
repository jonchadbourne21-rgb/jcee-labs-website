name: Public Surface

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surface:
    name: public-surface
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Qualify pinned Node bootstrap
        run: |
          node --test scripts/manus-build.test.mjs
          sh scripts/test-manus-node.sh
          JCEE_FORCE_NODE_BOOTSTRAP=1 sh scripts/manus-node.sh -- node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Rust visual sources and generated assets
        run: pnpm visuals:check

      - name: Select available browser
        run: sh scripts/ci-browser.sh

      - name: Run merge-blocking public-surface gate
        env:
          BUILD_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          pnpm release:check
          pnpm release:verify "$BUILD_SOURCE_COMMIT"

      - name: Preserve source and build receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jcee-deployment-receipt
          path: dist/public/deployment.json
          if-no-files-found: error

      - name: Capture enterprise visual review surfaces
        run: |
          mkdir -p artifacts/enterprise-visual-review/navigation
          cp node_modules/.cache/worldlab-navigation/result.json artifacts/enterprise-visual-review/navigation/result.json
          node scripts/enterprise-visual-capture.mjs
          node scripts/footer-visual-capture.mjs
          node scripts/worldlab-surface-check.mjs

      - name: Upload enterprise visual review evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jcee-enterprise-visual-review
          path: artifacts/enterprise-visual-review
          if-no-files-found: error
