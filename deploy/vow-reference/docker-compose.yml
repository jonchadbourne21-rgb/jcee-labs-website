name: vow-reference

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vow_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  vow-api:
    build:
      context: ../..
      dockerfile: deploy/vow-reference/Dockerfile
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --postgres
      - ${POSTGRES_DSN:?Set POSTGRES_DSN in .env}
    ports:
      - "${VOW_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  recovery-worker:
    build:
      context: ../..
      dockerfile: deploy/vow-reference/Dockerfile
    entrypoint: ["python", "/opt/vow-deployment/recovery_worker.py"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?Set POSTGRES_DSN in .env}
      VOW_SWEEP_INTERVAL_SECONDS: ${VOW_SWEEP_INTERVAL_SECONDS:-60}
      VOW_RUN_STALE_SECONDS: ${VOW_RUN_STALE_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
      vow-api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  postgres_data:
